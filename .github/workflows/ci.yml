---
name: Playwright UI Testing CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: |
          bun install

      - name: Install Playwright dependencies
        run: |
          bunx playwright install-deps

      - name: Install Playwright drivers
        run: |
          bunx playwright install chromium
          bunx playwright install firefox
          bunx playwright install webkit

      - name: Run code formatting
        run: |
          bunx prettier --check pages tests data

      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: |
          bunx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          retention-days: 7

  merge-reports:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
